name: Build and Deploy

# CI→GHCR→Coolify pipeline. Builds the Docker image off-VPS (GitHub runners
# have 16GB RAM; the 8GB CX32 OOM-thrashes on next build), pushes it to GHCR
# tagged with the commit SHA, then has Coolify run exactly that tag.
#
# Not triggered on its own: ci.yml calls it after `checks` and `e2e` pass on
# a push to main, so a commit that fails the tests never reaches production.
# To redeploy or roll back an already-validated commit, use rollback.yml.
#
# ── Change these lines when copying to another repo ──────────────────────────
#   IMAGE_NAME   ghcr.io/skale-club/<app-name>
#   APP_UUID     Coolify resource UUID (Settings → UUID in the app UI)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      sha:
        description: Commit that passed CI
        required: true
        type: string

concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/skale-club/xprout
  LEGACY_IMAGE_NAME: ghcr.io/skale-club/xmartmenu
  APP_UUID: gmaayluj11x1m6j7baogonfn
  COOLIFY_BASE: https://coolify.skale.club
  PUBLIC_URL: https://xprout.app

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Notify production build started
        continue-on-error: true
        env:
          OPS_TELEGRAM_ENABLED: ${{ vars.OPS_TELEGRAM_ENABLED }}
          OPS_TELEGRAM_BOT_TOKEN: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN }}
          OPS_TELEGRAM_CHAT_ID: ${{ secrets.OPS_TELEGRAM_CHAT_ID }}
          OPS_TELEGRAM_THREAD_ID: ${{ vars.OPS_TELEGRAM_THREAD_ID }}
          OPS_EVENT: build-started
          OPS_DETAIL: Validated production release entered the build and deploy pipeline.
          OPS_SHA: ${{ inputs.sha }}
          OPS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ops/telegram-ops.py notify

      - name: Require deployment credentials and full SHA
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Expected a full commit SHA.'; exit 1; }
          [ -n "$COOLIFY_TOKEN" ] || { echo '::error::COOLIFY_TOKEN is required; production was not deployed.'; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dual-publish the same build while old deployment/rollback consumers transition.
      - name: Build image and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ inputs.sha }}
            ${{ env.LEGACY_IMAGE_NAME }}:latest
            ${{ env.LEGACY_IMAGE_NAME }}:${{ inputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Public values only. Secrets go through `secrets:` (BuildKit mounts),
          # which keeps them out of image history and the build cache.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            GIT_SHA=${{ inputs.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Deploy this SHA with Coolify
        id: deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SHA: ${{ inputs.sha }}
        run: bash scripts/coolify-deploy.sh "$SHA"

      - name: Notify production pipeline outcome
        if: always()
        continue-on-error: true
        env:
          OPS_TELEGRAM_ENABLED: ${{ vars.OPS_TELEGRAM_ENABLED }}
          OPS_TELEGRAM_BOT_TOKEN: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN }}
          OPS_TELEGRAM_CHAT_ID: ${{ secrets.OPS_TELEGRAM_CHAT_ID }}
          OPS_TELEGRAM_THREAD_ID: ${{ vars.OPS_TELEGRAM_THREAD_ID }}
          OPS_EVENT: ${{ job.status == 'success' && steps.deploy.outcome == 'success' && 'deploy-succeeded' || job.status == 'cancelled' && 'build-deploy-cancelled' || 'build-deploy-failed' }}
          OPS_DETAIL: ${{ job.status == 'success' && steps.deploy.outcome == 'success' && 'Production readiness verified HTTP 200, healthy database and expected release.' || 'Production release pipeline did not complete successfully. Inspect the run and current production health.' }}
          OPS_SHA: ${{ inputs.sha }}
          OPS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ops/telegram-ops.py notify
