name: Uptime

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: false

jobs:
  ready:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore incident state
        uses: actions/cache/restore@v4
        with:
          path: .ops-state/uptime.json
          key: xprout-uptime-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: xprout-uptime-v1-
      - name: Probe production and notify transitions
        env:
          OPS_TELEGRAM_ENABLED: ${{ vars.OPS_TELEGRAM_ENABLED }}
          OPS_TELEGRAM_BOT_TOKEN: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN }}
          OPS_TELEGRAM_CHAT_ID: ${{ secrets.OPS_TELEGRAM_CHAT_ID }}
          OPS_TELEGRAM_THREAD_ID: ${{ vars.OPS_TELEGRAM_THREAD_ID }}
          OPS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ops/telegram-ops.py probe
      - name: Save observed and notified incident state even after failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ops-state/uptime.json
          key: xprout-uptime-v1-${{ github.run_id }}-${{ github.run_attempt }}
