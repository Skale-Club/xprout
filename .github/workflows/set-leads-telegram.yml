name: Set Leads Telegram destination

# Ops utility (manual only): writes the dedicated Xprout | Leads destination
# for access-request notices into the Coolify runtime env, then redeploys the
# SAME image already in production (IMAGE_TAG read back from Coolify) through
# scripts/coolify-deploy.sh, which proves readiness. It touches only
# ACCESS_REQUEST_TELEGRAM_BOT_TOKEN and ACCESS_REQUEST_TELEGRAM_CHAT_IDS.
# See docs/ops/telegram-leads.md.
#
# Secrets: ACCESS_REQUEST_TELEGRAM_CHAT_IDS (new: the Leads group id),
# OPS_TELEGRAM_BOT_TOKEN (the shared @skaleclubbot), OPS_TELEGRAM_CHAT_ID.

on:
  workflow_dispatch: {}

concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_UUID: gmaayluj11x1m6j7baogonfn
  COOLIFY_BASE: https://coolify.skale.club
  PUBLIC_URL: https://xprout.app

jobs:
  set-leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check and write the Leads destination, then redeploy the current image
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          BOT_TOKEN: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN }}
          OPS_CHAT: ${{ secrets.OPS_TELEGRAM_CHAT_ID }}
          LEADS_CHATS: ${{ secrets.ACCESS_REQUEST_TELEGRAM_CHAT_IDS }}
        run: |
          set -euo pipefail
          for v in COOLIFY_TOKEN BOT_TOKEN LEADS_CHATS; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done

          me=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getMe" | jq -r '.result.username // empty')
          [ "${me,,}" = "skaleclubbot" ] || { echo "::error::OPS_TELEGRAM_BOT_TOKEN is not the shared @skaleclubbot"; exit 1; }

          ops="${OPS_CHAT%%:*}"
          IFS=',' read -ra targets <<<"$LEADS_CHATS"
          for t in "${targets[@]}"; do
            t="$(echo "$t" | xargs)"; chat="${t%%:*}"
            [[ "$t" =~ ^-[1-9][0-9]*(:[1-9][0-9]*)?$ ]] || { echo "::error::Leads target is not a group id"; exit 1; }
            [ "$chat" != "$ops" ] || { echo "::error::Leads target equals the Ops chat"; exit 1; }
            status=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getChatMember?chat_id=${chat}&user_id=${BOT_TOKEN%%:*}" | jq -r '.result.status // .description')
            echo "==> bot status in Leads group: $status"
            case "$status" in member|administrator|creator) ;; *) echo "::error::the bot cannot post to the Leads group"; exit 1 ;; esac
          done

          api() { curl --fail-with-body -sS --retry 3 --retry-all-errors -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H 'Content-Type: application/json' "$@"; }
          envs="${COOLIFY_BASE}/api/v1/applications/${APP_UUID}/envs"
          upsert() {
            local payload; payload="$(jq -nc --arg k "$1" --arg v "$2" '{key:$k,value:$v,is_preview:false,is_literal:true}')"
            api -X PATCH "$envs" -d "$payload" >/dev/null 2>&1 || api -X POST "$envs" -d "$payload" >/dev/null
            [ "$(api "$envs" | jq -r --arg k "$1" '[.[] | select(.key == $k and (.is_preview | not))][0].value // empty')" = "$2" ] \
              || { echo "::error::$1 readback does not match"; exit 1; }
            echo "==> $1 set"
          }
          upsert ACCESS_REQUEST_TELEGRAM_BOT_TOKEN "$BOT_TOKEN"
          upsert ACCESS_REQUEST_TELEGRAM_CHAT_IDS "$LEADS_CHATS"

          sha="$(api "$envs" | jq -r '[.[] | select(.key == "IMAGE_TAG" and (.is_preview | not))][0].value // empty')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not read the running IMAGE_TAG"; exit 1; }
          repo="$(api "$envs" | jq -r '[.[] | select(.key == "IMAGE_REPOSITORY" and (.is_preview | not))][0].value // empty')"
          echo "==> redeploying the running image ${repo:-default}:${sha}"
          IMAGE_REPOSITORY="${repo:-ghcr.io/skale-club/xprout}" bash scripts/coolify-deploy.sh "$sha"
